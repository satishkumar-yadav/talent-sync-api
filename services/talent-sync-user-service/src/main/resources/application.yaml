server: 
  port: 5001
spring:
  application:
    name: talent-sync-user-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:5432/talent_sync_user
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver      

